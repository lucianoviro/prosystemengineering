          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Solo se l'intervento è una modifica sostanziale, cioè se crea nuovi pericoli o aumenta i rischi esistenti in modo non previsto dal fabbricante originale. In quel caso chi esegue la modifica diventa fabbricante: deve redigere valutazione dei rischi, fascicolo tecnico e dichiarazione di conformità e apporre la marcatura CE. Se la modifica non è sostanziale, è consigliabile documentarlo con una relazione tecnica."
